<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ✅ Correct favicon path for Vite -->
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <!-- ✅ Title/description for HOME (SPA will override per route later) -->
    <title>AIM Construction Management | Underground Utility & Directional Drilling</title>
    <meta
      name="description"
      content="Safety-first crews delivering fast, dependable underground utility, directional drilling, and restoration work across Florida and beyond."
    />

    <!-- ✅ Canonical (domain swapped) -->
    <link rel="canonical" href="https://aimconstructionmgt.com/" />

    <!-- ✅ Open Graph -->
    <meta property="og:title" content="AIM Construction Management" />
    <meta
      property="og:description"
      content="Underground utility, directional drilling, and restoration across Florida and beyond."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aimconstructionmgt.com/" />
    <meta property="og:image" content="https://aimconstructionmgt.com/img/og-cover.png" />

    <!-- ✅ Performance: preload your hero poster if it exists -->
    <link rel="preload" as="image" href="/img/hero-poster.webp" fetchpriority="high" />

    <!-- ✅ Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "GeneralContractor",
        "name": "AIM Construction Management",
        "url": "https://aimconstructionmgt.com/",
        "telephone": "+1-305-331-5759",
        "email": "aimconstructionmgt@gmail.com",
        "areaServed": "Florida",
        "description": "Underground utility, directional drilling, and restoration services."
      }
    </script>
    <script>
      // pick light/dark before first paint (see src/lib/theme.js)
      (function () {
        var ready = ["/", "/services"], t = "dark";
        try {
          var saved = localStorage.getItem("aim-theme");
          t = saved === "light" || saved === "dark" ? saved
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t === "light" && ready.indexOf(location.pathname) !== -1 ? "light" : "dark");
      })();
    </script>
  </head>
  <body>
    <!-- Netlify form detection (the real forms are rendered by React) -->
    <form name="residential-quote" data-netlify="true" data-netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="phone" />
      <input name="email" />
      <input name="address" />
      <select name="project-type"></select>
      <select name="timeline"></select>
      <textarea name="message"></textarea>
      <input name="photo" type="file" />
      <input name="photo-2" type="file" />
      <input name="photo-3" type="file" />
      <input name="photo-4" type="file" />
      <input name="photo-5" type="file" />
    </form>

    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="location" />
      <input name="side" />
      <input name="project-type" />
      <textarea name="message"></textarea>
      <input name="timeline" />
      <input name="photo" type="file" />
      <input name="photo-2" type="file" />
      <input name="photo-3" type="file" />
      <input name="photo-4" type="file" />
      <input name="photo-5" type="file" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
