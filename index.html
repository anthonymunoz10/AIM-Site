    <script>
      // mark JS as on, so the prerendered copy stays hidden (scripts/prerender.mjs)
      document.documentElement.classList.add("js");
      // pick light/dark before first paint (see src/lib/theme.js)
      (function () {
        var ready = ["/", "/services"], t = "dark";
        try {
          var saved = localStorage.getItem("aim-theme");
          t = saved === "light" || saved === "dark" ? saved
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t === "light" && (ready.indexOf(location.pathname) !== -1 || /^\/(services|residential)\/[a-z-]+\/?$/.test(location.pathname)) ? "light" : "dark");
      })();
    </script>
